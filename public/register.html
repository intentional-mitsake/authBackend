<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · AuthBackend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
<nav id="nav"></nav>
 
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create account</h2>
    <p>Fill in the fields below to register.</p>
 
    <div class="alert alert-error" id="err"></div>
    <div class="alert alert-success" id="ok"></div>
 
    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" placeholder="user@example.com" />
    </div>
    <div class="form-group">
      <label>Username</label>
      <input id="username" type="text" placeholder="username" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" />
    </div>
 
    <button class="btn btn-primary" onclick="doRegister()">Register</button>
 
    <div class="switch">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>
 
<script src="app.js"></script>
<script>
  redirectIfAuthed();
  buildNav();
 
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
 
  async function doRegister() {
    const email    = document.getElementById('email').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
 
    if (!email || !username || !password) return showAlert('err', 'All fields required.', 'error');
 
    const res  = await api('POST', '/auth/register', { email, username, password }, false);
    console.log("Status Code: " + res.status);
    const data = await res.json();
 
    if (res.ok) {
      setToken(data.accessToken);
      const payload = parseToken(data.accessToken);
      if (payload?.role) setRole(payload.role);
      showAlert('ok', 'Account created. Redirecting…', 'success');
      setTimeout(() => window.location.href = 'home.html', 800);
    } else {
      showAlert('err', data.error || 'Registration failed.', 'error');
    }
  }
</script>
</body>
</html>
