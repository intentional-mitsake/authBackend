<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · AuthBackend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
<nav id="nav"></nav>
 
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Sign in</h2>
    <p>Enter your email or username and password.</p>
 
    <div class="alert alert-error" id="err"></div>
    <div class="alert alert-success" id="ok"></div>
 
    <div class="form-group">
      <label>Email or Username</label>
      <input id="email" type="text" placeholder="user@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" />
    </div>
 
    <button class="btn btn-primary" onclick="doLogin()">Login</button>
 
    <div class="switch">
      No account? <a href="register.html">Register</a>
    </div>
  </div>
</div>
 
<script src="app.js"></script>
<script>
  redirectIfAuthed();
  buildNav();
 
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
 
  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let username;
    const password = document.getElementById('password').value;
 
    if (!email || !password) return showAlert('err', 'All fields required.', 'error');

    let res;
    let data;
    if (!regex.test(email)) {
      // if email is not a valid email it is probably a username
      username = document.getElementById('email').value.trim();
      res  = await api('POST', '/auth/login', { password, username }, false);
      data = await res.json();
    } else {
      res  = await api('POST', '/auth/login', { email, password, username }, false);
      data = await res.json();
    }
 
    if (res.ok) {
      setToken(data.accessToken);
      const payload = parseToken(data.accessToken);
      if (payload?.role) setRole(payload.role);
      showAlert('ok', 'Logged in. Redirecting…', 'success');
      setTimeout(() => window.location.href = 'home.html', 800);
    } else {
      showAlert('err', data.error || 'Login failed.', 'error');
    }
  }
</script>
</body>
</html>
